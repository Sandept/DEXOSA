name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./Web - Demo 1/Iron_man/package-lock.json"

      - name: Install dependencies
        working-directory: "./Web - Demo 1/Iron_man"
        run: npm ci

      - name: Build with Next.js
        working-directory: "./Web - Demo 1/Iron_man"
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "./Web - Demo 1/Iron_man/out"
          publish_branch: gh-pages
          force_orphan: true
